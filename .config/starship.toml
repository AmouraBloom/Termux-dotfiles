"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

# ---------------------------------------------------------
# TWO-LINE CLEAN FORMAT
# ---------------------------------------------------------
format = """
$shell$directory \
$git_branch$git_status
$nodejs$python$rust$golang\
$time$cmd_duration$character\
"""
# ---------------------------------------------------------
# SHELL MODULE (just icon + name)
# ---------------------------------------------------------
[shell]
disabled = false
format = "[$indicator]($style) "
style = "bold cyan"
bash_indicator = " "
zsh_indicator = "" 
fish_indicator = "󰈺 "
powershell_indicator = " pwsh"
ion_indicator = "⚙️ ion"
elvish_indicator = "✨ elvish"
tcsh_indicator = "tcsh"
xonsh_indicator = "🧬 xonsh"
cmd_indicator = " cmd"
nu_indicator = "󰞷 nu"

# ---------------------------------------------------------
# DIRECTORY (your old style)
# ---------------------------------------------------------
[directory]
truncation_length = 3
style = "bold blue"
format = "[$path]($style) "

# ---------------------------------------------------------
# GIT (compact for small screens)
# ---------------------------------------------------------
[git_branch]
symbol = ""
style = "purple"
format = "[$symbol $branch]($style) "

[git_status]
style = "yellow"
#format = "[$all_status$ahead_behind]($style) "

# -----------------------------------------
# Programming Language Modules
# -----------------------------------------
[nodejs]
symbol = "󰎙 "
style = "green"
detect_extensions = ["js", "ts", "mjs", "cjs"]

[python]
symbol = " "
style = "green"
detect_extensions = ["py"]

[rust]
symbol = " "
style = "red"

[golang]
symbol = "󰟓 "
style = "cyan"

# ---------------------------------------------------------
# TIME (small + clean)
# ---------------------------------------------------------
[time]
disabled = false
time_format = "%H:%M"
style = "bold white"
format = "[$time]($style) "

# -----------------------------------------
# Command duration
# -----------------------------------------
[cmd_duration]
min_time = 5000
format = "⏳[$duration](bold yellow) "
show_milliseconds = false

# ---------------------------------------------------------
# PROMPT CHARACTER
# ---------------------------------------------------------
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[✗](bold red)"
vicmd_symbol = "[V](bold green) "

#  Time Format
# "%H:%M"  → 19:32
# "%I:%M %p"  → 07:32 PM 
# "%I:%M:%S %p"  → 07:32:15 PM  
#  "%l:%M %p"  → 7:32 PM (no leading zero)
